# Runs the real Garak-backed attack generator (requires the `garak` extra
# installed: pip install 'llm-redteam-firewall[garak]') against a real
# OpenAI model (requires the `openai` extra: pip install
# 'llm-redteam-firewall[openai]', plus OPENAI_API_KEY set in the
# environment or in a .env file in the working directory — the CLI
# loads it automatically via python-dotenv), and renders the result as
# a standalone HTML report:
#
#   llm-redteam-firewall run --config configs/garak_html_demo.yaml
#
# Swap `target:` to point at a different model, or back to `type: mock`
# for a zero-dependency, zero-cost pipeline smoke test.

name: garak-html-demo
description: Real Garak probe corpus against gpt-5.4-nano, reported as HTML.

generator:
  type: garak

target:
  type: openai
  params:
    model: gpt-5.4-nano

evaluator:
  type: judge_and_rules
  params:
    judge_model: gpt-5.4-nano

storage:
  type: in_memory

reporters:
  - type: console
  - type: html
    params:
      output_path: build/garak-html-report.html

max_attacks_per_vulnerability: 15
concurrency: 5
timeout_seconds: 30

vulnerabilities:
  - id: prompt_injection
  - id: jailbreak
  - id: prompt_leakage
  - id: pii_leakage
  - id: secret_leakage
  - id: tool_misuse
  - id: hateful_content
