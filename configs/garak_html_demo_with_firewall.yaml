# Same campaign as configs/garak_html_demo.yaml, but the target is
# gated by llm_firewall (configs/example_firewall_with_nemo.yaml's
# policies, including NemoGuardrailsPolicy) instead of talking to OpenAI
# directly. Run both and diff the reports to see what the firewall
# actually catches:
#
#   llm-redteam run --config configs/garak_html_demo.yaml
#   llm-redteam run --config configs/garak_html_demo_with_firewall.yaml
#
# Note: `generator: type: garak` isn't guaranteed to produce byte-identical
# attacks across two separate runs, so this is a good first look, not a
# strictly controlled A/B comparison -- for that, generate attacks once
# and run both targets against the same list (see the FirewallTarget
# design notes, or examples/evaluate_firewall_precision.py).
#
# `false_positive_check` rides along in the same campaign as every real
# vulnerability -- it sends genuine, legitimate prompts (some deliberately
# worded to *look* suspicious) and expects the firewall to let them
# through. Two wrappers make this coexist with real attacks in one
# report, since CampaignOrchestrator only supports one generator and one
# evaluator per campaign:
#   - `mixed` (generator) routes false_positive_check to GenuinePromptGenerator
#     and everything else to the wrapped `garak` generator.
#   - `firewall_aware` (evaluator) grades false_positive_check by whether
#     the firewall blocked it (inverted semantics -- a block there is the
#     finding), and for everything else, short-circuits to "resisted"
#     whenever the firewall already blocked the attack, only calling the
#     wrapped judge_and_rules evaluator on traffic that actually reached
#     the target.
#
# Requires everything garak_html_demo.yaml does (`garak` and `openai`
# extras, OPENAI_API_KEY set) plus the `nemo-guardrails` extra, since the
# referenced firewall config enables NemoGuardrailsPolicy. Point
# firewall_config_path at configs/firewall_regex_only.yaml (recreate it
# first) for a regex-only, nemo-free run instead.

name: LLM RedTeaming (firewall)
description: Real Garak probe corpus (plus genuine traffic) against gpt-5.4-nano, gated by llm_firewall, reported as HTML.

generator:
  type: mixed
  params:
    wrapped_type: garak

target:
  type: firewall
  params:
    inner_type: openai
    inner_params:
      model: gpt-5.4-nano
    firewall_config_path: configs/example_firewall_with_nemo.yaml

evaluator:
  type: firewall_aware
  params:
    wrapped_type: judge_and_rules
    wrapped_params:
      judge_model: gpt-5.4-nano

storage:
  type: in_memory

reporters:
  - type: console
  - type: html
    params:
      output_path: build/garak-html-report-with-firewall.html

max_attacks_per_vulnerability: 15
concurrency: 5
timeout_seconds: 30

vulnerabilities:
  - id: prompt_injection
  - id: jailbreak
  - id: prompt_leakage
  - id: pii_leakage
  - id: secret_leakage
  - id: tool_misuse
  - id: hateful_content
  - id: false_positive_check
