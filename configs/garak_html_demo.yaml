# Runs the real Garak-backed attack generator (requires the `garak` extra
# installed: pip install 'llm-redteam[garak]') against a real
# OpenAI model (requires the `openai` extra: pip install
# 'llm-redteam[openai]', plus OPENAI_API_KEY set in the
# environment or in a .env file in the working directory — the CLI
# loads it automatically via python-dotenv), and renders the result as
# a standalone HTML report:
#
#   llm-redteam run --config configs/garak_html_demo.yaml
#
# Swap `target:` to point at a different model, or back to `type: mock`
# for a zero-dependency, zero-cost pipeline smoke test.
#
# `false_positive_check` rides along here too, same as in
# garak_html_demo_with_firewall.yaml -- but there's no firewall in this
# config, so "wrongly blocked" means something different: FirewallAwareEvaluator
# falls back to checking whether the model *itself* refused a genuine,
# innocent prompt (over-refusal), rather than whether a firewall blocked
# it (there's no firewall here to do that). Two different questions --
# "does the model over-refuse" vs. "does the firewall over-block" -- each
# meaningful in its own config.

name: LLM RedTeaming (no firewall)
description: Real Garak probe corpus (plus genuine traffic) against gpt-5.4-nano, reported as HTML.

generator:
  type: mixed
  params:
    wrapped_type: garak

target:
  type: openai
  params:
    model: gpt-5.4-nano

evaluator:
  type: firewall_aware
  params:
    wrapped_type: judge_and_rules
    wrapped_params:
      judge_model: gpt-5.4-nano

storage:
  type: in_memory

reporters:
  - type: console
  - type: html
    params:
      output_path: build/garak-html-report.html

max_attacks_per_vulnerability: 15
concurrency: 5
timeout_seconds: 30

vulnerabilities:
  - id: prompt_injection
  - id: jailbreak
  - id: prompt_leakage
  - id: pii_leakage
  - id: secret_leakage
  - id: tool_misuse
  - id: hateful_content
  - id: false_positive_check
