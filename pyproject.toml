[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-redteam"
version = "0.1.0"
description = "A pluggable, hexagonal-architecture LLM red-team harness."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "llm-redteam contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]
# Extras for adapters that are currently scaffold stubs. Installing one
# of these does not, by itself, implement the adapter — see the
# NotImplementedError bodies in src/llm_redteam/adapters/.
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
http = ["httpx>=0.27"]
langgraph = ["langgraph>=0.2"]
# Unlike the extras above, `garak` backs a fully implemented adapter
# (adapters/attack_generators/garak/) -- this extra is only about the
# third-party dependency, not scaffold status.
garak = ["garak>=0.13"]

[project.scripts]
llm-redteam = "llm_redteam.cli.main:main"

[project.urls]
Homepage = "https://github.com/surajpanda186/llm-redteam"
Repository = "https://github.com/surajpanda186/llm-redteam"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test/llm_redteam"]
asyncio_mode = "strict"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "test/llm_redteam", "examples"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length is enforced by the formatter, not the linter
]

[tool.ruff.lint.isort]
known-first-party = ["llm_redteam"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["llm_redteam"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
# Protocol-satisfying adapters intentionally omit `-> None` on plain
# attributes like `name`; keep this false to avoid noisy false positives
# on plugin classes until they grow real method bodies.
disallow_untyped_decorators = false
